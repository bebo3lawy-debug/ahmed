<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كابتن أحمد العلاوي - حجز جلسات مساج</title>
  
  <!-- مكتبة EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .booking-card {
      background-color: #1e1e1e;
      border: 1px solid #d4af37; /* لون ذهبي */
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.15);
    }
    h2 {
      color: #d4af37;
      text-align: center;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      color: #c0c0c0;
      font-size: 14px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background-color: #2a2a2a;
      color: #fff;
      box-sizing: border-box;
      font-size: 15px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #d4af37;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #d4af37;
      color: #121212;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin-top: 10px;
    }
    button:hover {
      background-color: #f3cf55;
    }
    #status-message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="booking-card">
    <h2>حجز جلسة مساج</h2>
    
    <form id="booking-form">
      <div class="form-group">
        <label for="user_name">الاسم بالكامل:</label>
        <input type="text" id="user_name" name="user_name" required placeholder="أدخل اسمك الكريم">
      </div>

      <div class="form-group">
        <label for="user_phone">رقم الهاتف / الواتساب:</label>
        <input type="tel" id="user_phone" name="user_phone" required placeholder="01xxxxxxxx">
      </div>

      <div class="form-group">
        <label for="user_location">المنطقة / العنوان:</label>
        <input type="text" id="user_location" name="user_location" required placeholder="مثال: القاهرة، المعادي">
      </div>

      <div class="form-group">
        <label for="service_type">نوع الجلسة المطلوبة:</label>
        <select id="service_type" name="service_type" required>
          <option value="" disabled selected>اختر نوع الجلسة</option>
          <option value="مساج رياضي واستشفاء عضلات">مساج رياضي واستشفاء عضلات</option>
          <option value="مساج استرخائي (Relaxation)">مساج استرخائي (Relaxation)</option>
          <option value="جلسة مساج علاجي">جلسة مساج علاجي</option>
        </select>
      </div>

      <div class="form-group">
        <label for="user_notes">ملاحظات إضافية:</label>
        <textarea id="user_notes" name="user_notes" rows="3" placeholder="أي تفاصيل أو إصابات ترغب في توضيحها..."></textarea>
      </div>

      <button type="submit" id="submit-btn">إرسال طلب الحجز</button>
      <div id="status-message"></div>
    </form>
  </div>

  <script>
    // 1. تهيئة مكتبة EmailJS بالـ Public Key الخاص بك
    (function() {
      emailjs.init("KcAV_V0r3-mDR5UjE"); 
    })();

    // 2. معالجة إرسال النموذج
    document.getElementById('booking-form').addEventListener('submit', function(event) {
      event.preventDefault();

      const btn = document.getElementById('submit-btn');
      const statusMsg = document.getElementById('status-message');

      btn.innerText = 'جاري الإرسال...';
      btn.disabled = true;

      // البيانات التي تم إعدادها
      const serviceID = 'service_gzb3onh';
      const templateID = 'template_v3ml94b';

      emailjs.sendForm(serviceID, templateID, this)
        .then(function() {
          btn.innerText = 'تم الإرسال بنجاح!';
          statusMsg.style.color = '#4CAF50';
          statusMsg.innerText = 'تم استلام طلبك بنجاح، وسنتواصل معك في أقرب وقت.';
          document.getElementById('booking-form').reset();
          
          setTimeout(() => {
            btn.innerText = 'إرسال طلب الحجز';
            btn.disabled = false;
            statusMsg.innerText = '';
          }, 5000);
        }, function(error) {
          btn.innerText = 'إرسال طلب الحجز';
          btn.disabled = false;
          statusMsg.style.color = '#f44336';
          statusMsg.innerText = 'حدث خطأ أثناء الإرسال، يرجى المحاولة لاحقاً.';
          console.error('EmailJS Error:', error);
        });
    });
  </script>

</body>
</html>
